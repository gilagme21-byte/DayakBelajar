<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-labelledby="title desc">
<title id="title">Maskot burung Tingang DayakBelajar</title><desc id="desc">Ilustrasi kartun burung rangkong hitam dan putih dengan paruh kuning-oranye serta ikat kepala bermotif geometris.</desc>
<defs>
 <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe16b"/><stop offset="1" stop-color="#e89a22"/></linearGradient>
 <linearGradient id="crest" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5c94f"/><stop offset="1" stop-color="#a96c25"/></linearGradient>
</defs>
